<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>CHILAGU LEGACY CINEMA</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js"></script>
<style>
    :root { --purple: #6A0DAD; --silver: #C0C0C0; --black: #000; }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body { background: var(--black); color: var(--silver); padding-bottom: 60px; }
    
    .header { padding: 10px 15px; background: #0A0A0A; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid var(--purple); }
    .logo { height: 40px; display: block; cursor: pointer; }
    .search-bar { width: 100%; padding: 10px; margin-top: 10px; border-radius: 8px; border: 1px solid #333; background: #111; color: white; font-size: 13px; }

    .main-cats { display: flex; gap: 8px; padding: 12px 15px; overflow-x: auto; background: #0A0A0A; }
    .main-btn { padding: 8px 16px; background: #1A1A1A; border: 1px solid #333; border-radius: 20px; color: var(--silver); font-weight: 600; font-size: 12px; white-space: nowrap; }
    .main-btn.active { background: var(--purple); color: white; border-color: var(--purple); }

    .sub-cats { display: flex; gap: 8px; padding: 10px 15px; overflow-x: auto; background: #0F0F0F; border-bottom: 1px solid #1A1A1A; }
    .sub-btn { padding: 6px 12px; background: #1A1A1A; border-radius: 15px; color: var(--silver); font-size: 11px; }
    .sub-btn.active { background: var(--purple); color: white; }

    .banner { width: 100%; height: 180px; background: #111; }
    .banner video { width: 100%; height: 100%; object-fit: cover; }

    .section-title { padding: 15px; font-size: 15px; font-weight: 700; color: white; }
    .movie-row { display: flex; gap: 10px; padding: 0 15px 20px; overflow-x: auto; }
    .movie-card { min-width: 30%; background: #111; border-radius: 6px; overflow: hidden; }
    .movie-card img { width: 100%; height: 140px; object-fit: cover; background: #222; }
    .movie-card p { padding: 8px; font-size: 11px; font-weight: 600; color: white; }

    .player-container { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: black; z-index: 20; }
    .player-container video { width: 100%; height: 100%; }
    .close-player { position: absolute; top: 10px; right: 15px; font-size: 28px; color: white; z-index: 21; font-weight: 700; }
    
    .bottom-nav { position: fixed; bottom: 0; width: 100%; display: flex; justify-content: space-around; background: #0A0A0A; padding: 8px 0; border-top: 1px solid #1A1A1A; }
    .nav-btn { color: var(--silver); text-align: center; font-size: 10px; font-weight: 600; padding: 5px; }

    .admin-modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.98); z-index: 30; padding: 20px; overflow-y: auto; }
    .admin-box { background: #111; padding: 20px; border-radius: 8px; border: 1px solid var(--purple); }
    .admin-box h2 { color: var(--purple); margin-bottom: 15px; font-size: 16px; }
    .admin-box input, .admin-box select, .admin-box button { width: 100%; padding: 10px; margin: 8px 0; background: #1A1A1A; border: 1px solid #333; color: white; border-radius: 6px; font-size: 12px; }
    .admin-box button { background: var(--purple); font-weight: 700; border: none; }
</style>
</head>
<body>

<div class="header">
    <img src="https://i.postimg.cc/sgdFWWny/730381752-122095308855376480-8982864997012554160-n.jpg" class="logo" id="logoBtn">
    <input type="text" id="search" class="search-bar" placeholder="Tafuta...">
</div>

<div class="main-cats" id="mainCats"></div>
<div class="sub-cats" id="subCats"></div>

<div class="banner">
    <video id="bannerVideo" autoplay muted loop playsinline></video>
</div>

<h3 class="section-title" id="sectionTitle">Filamu Mpya</h3>
<div class="movie-row" id="contentGrid"><p style="padding:20px">Inapakia kutoka Firebase...</p></div>

<div class="player-container" id="player">
    <div class="close-player" id="closeBtn">X</div>
    <video id="videoPlayer" controls playsinline></video>
</div>

<div class="bottom-nav">
    <div class="nav-btn" id="navHome">Home</div>
    <div class="nav-btn" id="navShop">Shop</div>
    <div class="nav-btn" id="navAcademy">Academy</div>
</div>

<div class="admin-modal" id="adminPanel">
    <div class="admin-box">
        <h2>ADMIN ACCESS</h2>
        <input type="password" id="adminPin" placeholder="Weka PIN 1255">
        <button id="loginBtn">INGIA</button>
        
        <div id="adminControls" style="display:none">
            <h3>Ongeza Content</h3>
            <input id="mTitle" placeholder="Title">
            <input id="mPoster" placeholder="Poster URL">
            <input id="mVideo" placeholder="Video Link">
            <input id="mTrailer" placeholder="Trailer Link for Banner">
            <select id="mType"><option>Single Movie</option><option>Series</option><option>FlashCut</option></select>
            <select id="mGenre"><option>Action</option><option>Drama</option><option>Love Story</option><option>Inspiration</option></select>
            <select id="mPrice"><option value="free">Free</option><option value="paid">Paid</option></select>
            <button id="addMovieBtn">ADD CONTENT</button>
            <button id="logoutBtn" style="background:#550000">CLOSE</button>
        </div>
    </div>
</div>

<script>
// 1. WEKA CONFIG YAKO YA FIREBASE HAPA. ITOE KUTOKA FIREBASE > PROJECT SETTINGS
const firebaseConfig = {
  apiKey: "WEKA_HAPA",
  authDomain: "WEKA_HAPA",
  projectId: "WEKA_HAPA",
  storageBucket: "WEKA_HAPA",
  messagingSenderId: "WEKA_HAPA",
  appId: "WEKA_HAPA"
};

// ANZISHA FIREBASE
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let clickCount = 0;
let currentMainCat = "All";
let currentGenre = "All";
let allMovies = [];

const mainCats = ["All", "Single Movie", "Series", "FlashCut", "Shop"];
const subCats = ["All", "Action", "Drama", "Love Story", "Inspiration"];

window.onload = function() {
    buildCategories();
    attachEvents();
    loadMoviesFromFirebase();
}

function buildCategories() {
    const mainDiv = document.getElementById('mainCats');
    mainCats.forEach(cat => {
        const btn = document.createElement('div');
        btn.className = 'main-btn' + (cat === 'All' ? ' active' : '');
        btn.innerText = cat;
        btn.onclick = function(){ setMainCat(cat, btn); }
        mainDiv.appendChild(btn);
    });

    const subDiv = document.getElementById('subCats');
    subCats.forEach(cat => {
        const btn = document.createElement('div');
        btn.className = 'sub-btn' + (cat === 'All' ? ' active' : '');
        btn.innerText = cat;
        btn.onclick = function(){ setGenre(cat, btn); }
        subDiv.appendChild(btn);
    });
}

function attachEvents() {
    document.getElementById('logoBtn').onclick = function(){
        clickCount++;
        if(clickCount >= 5) { document.getElementById('adminPanel').style.display = 'block'; clickCount = 0; }
        setTimeout(function(){ clickCount = 0; }, 3000);
    };
    
    document.getElementById('loginBtn').onclick = checkPin;
    document.getElementById('addMovieBtn').onclick = addMovieToFirebase;
    document.getElementById('logoutBtn').onclick = function(){ document.getElementById('adminPanel').style.display = 'none'; };
    document.getElementById('closeBtn').onclick = closePlayer;
    document.getElementById('navShop').onclick = function(){ setMainCat('Shop'); };
}

function setMainCat(cat, btn) {
    document.querySelectorAll('.main-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentMainCat = cat;
    document.getElementById('subCats').style.display = cat === 'Shop' ? 'none' : 'flex';
    document.getElementById('sectionTitle').innerText = cat;
    renderContent();
}

function setGenre(cat, btn) {
    document.querySelectorAll('.sub-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentGenre = cat;
    renderContent();
}

function checkPin() {
    if(document.getElementById('adminPin').value === '1255') {
        document.getElementById('adminControls').style.display = 'block';
    } else { alert('PIN ERROR'); }
}

function addMovieToFirebase() {
    db.collection("movies").add({
        title: document.getElementById('mTitle').value, 
        poster: document.getElementById('mPoster').value, 
        videoLink: document.getElementById('mVideo').value,
        trailerLink: document.getElementById('mTrailer').value, 
        type: document.getElementById('mType').value, 
        genre: document.getElementById('mGenre').value,
        price: document.getElementById('mPrice').value
    })
    .then(() => {
        alert('Imeongezwa Firebase');
        loadMoviesFromFirebase();
    })
    .catch((error) => { alert("Error: " + error); });
}

function loadMoviesFromFirebase() {
    db.collection("movies").get().then((querySnapshot) => {
        allMovies = [];
        querySnapshot.forEach((doc) => {
            allMovies.push(doc.data());
        });
        renderContent();
    });
}
  
function renderContent() {
    let filtered = allMovies;
    if(currentMainCat !== 'All' && currentMainCat !== 'Shop') {
        filtered = filtered.filter(m => m.type === currentMainCat);
    }
    if(currentGenre !== 'All') {
        filtered = filtered.filter(m => m.genre === currentGenre);
    }

    const grid = document.getElementById('contentGrid');
    grid.innerHTML = '';
    filtered.forEach(m => {
        const card = document.createElement('div');
        card.className = 'movie-card';
        card.onclick = function(){ playMovie(m.videoLink); }
        card.innerHTML = '<img src="'+m.poster+'"><p>'+m.title+'</p>';
        grid.appendChild(card);
    });
    if(filtered.length === 0) grid.innerHTML = "<p style='padding:20px'>Hakuna content. Ingia Admin uongeze.</p>";
}

function playMovie(link) {
    if(!link) return;
    document.getElementById('videoPlayer').src = link;
    document.getElementById('player').style.display = 'block';
    document.getElementById('videoPlayer').play();
}
function closePlayer() {
    document.getElementById('videoPlayer').pause();
    document.getElementById('player').style.display = 'none';
}
</script>
</body>
</html>
