<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>CHILAGU LEGACY SHOP</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--purple:#6A0DAD;--silver:#C0C0C0;--black:#000;--red:#D32F2F;--green:#2E7D32}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:var(--black);color:var(--silver);padding-bottom:80px}
.header{padding:10px 15px;background:#0A0A0A;position:sticky;top:0;z-index:10;border-bottom:1px solid var(--purple)}
.logo{height:40px;display:block;cursor:pointer}
.page{display:none}.page.active{display:block}
.help-page{padding:20px 15px}.help-page h2{color:var(--purple);margin:15px 0}
.help-video{width:100%;border-radius:8px;margin:10px 0}
.update-box{background:#1A1A1A;padding:12px;border-left:3px solid var(--purple);margin:10px 0;border-radius:5px}
.update-box a{color:var(--purple);text-decoration:underline}.update-box img{width:100%;border-radius:5px;margin-top:8px}
.admin-modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.98);z-index:30;padding:20px;overflow-y:auto}
.admin-box{background:#111;padding:20px;border-radius:8px;border:1px solid var(--purple)}
.admin-box input,.admin-box textarea,.admin-box button{width:100%;padding:10px;margin:8px 0;background:#1A1A1A;border:1px solid #333;color:white;border-radius:6px}
.admin-box button{background:var(--purple);font-weight:700;border:none;cursor:pointer}
.btn-delete{background:var(--red)!important}.btn-edit{background:var(--green)!important}
.admin-product-item{display:flex;justify-content:space-between;align-items:center;padding:8px;background:#1A1A1A;margin-bottom:5px;border-radius:5px;font-size:11px}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--purple);color:white;padding:10px 20px;border-radius:20px;display:none;z-index:40}
.bottom-nav{position:fixed;bottom:0;width:100%;display:flex;justify-content:space-around;background:#0A0A0A;padding:10px 0;border-top:1px solid #1A1A1A;z-index:20}
.nav-btn{color:var(--silver);text-align:center;font-size:11px;font-weight:600;cursor:pointer}
.nav-btn.active{color:var(--purple)}
</style>
</head>
<body>

<div class="header"><img src="https://i.postimg.cc/sgdFWWny/730381752-122095308855376480-8982864997012554160-n.jpg" class="logo" id="logoBtn"></div>

<div class="page active" id="homePage"><h3 style="padding:20px">HOME</h3></div>

<div class="page" id="helpPage">
<div class="help-page">
<h2>VIDEO ZA MSAADA</h2><div id="helpVideos"></div>
<h2>TAARIFA MPYA</h2><div id="updatesList"></div>
</div>
</div>

<div class="bottom-nav">
<div class="nav-btn active" id="navHome">Home</div>
<div class="nav-btn" id="navHelp">Msaada</div>
</div>

<div class="admin-modal" id="adminPanel">
<div class="admin-box">
<h2>ADMIN PANEL</h2>
<input type="password" id="adminPin" placeholder="Weka PIN: 1255">
<button id="loginBtn">INGIA</button>
<div id="adminControls" style="display:none">

<h3>VIDEO ZA MSAADA</h3>
<input id="videoTitle" placeholder="Jina la Video">
<input id="videoLink" placeholder="Link ya Video">
<input type="hidden" id="videoEditKey">
<button id="addVideoBtn">ONGEZA VIDEO</button>
<div id="adminVideoList"></div>

<h3>TAARIFA MPYA</h3>
<input id="updateTitle" placeholder="Kichwa">
<textarea id="updateText" placeholder="Andika hapa. Tumia <a href='link'>link</a> na <img src='link'>"></textarea>
<input type="hidden" id="updateEditKey">
<button id="addUpdateBtn">POST TAARIFA</button>
<div id="adminUpdateList"></div>

<button id="logoutBtn" style="background:#550000;margin-top:20px">FUNGA</button>
</div></div></div>
<div class="toast" id="toast"></div>

<script>
const DB_URL="https://chilagu-shop-859ec-default-rtdb.firebaseio.com";
let ADMIN_PIN="1255";

window.onload=function(){
loadVideos(); // HII NDIO ILIKUA INAKOSEA
loadUpdates(); // HII PIA
attachEvents();
}

function showToast(m){const t=document.getElementById('toast');t.innerText=m;t.style.display='block';setTimeout(()=>t.style.display='none',2000)}
function showPage(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));if(id=='homePage')navHome.classList.add('active');if(id=='helpPage')navHelp.classList.add('active')}

function attachEvents(){
logoBtn.onclick=()=>{adminPanel.style.display='block'}
loginBtn.onclick=checkPin
addVideoBtn.onclick=saveVideo
addUpdateBtn.onclick=saveUpdate
logoutBtn.onclick=()=>adminPanel.style.display='none'
navHome.onclick=()=>showPage('homePage')
navHelp.onclick=()=>showPage('helpPage')
}

function checkPin(){
if(adminPin.value===ADMIN_PIN){
adminControls.style.display='block';showToast("Karibu Admin");
loadAdminVideos();loadAdminUpdates();
}else{showToast('PIN SIO SAHI')}
}

// KAZI KUBWA IKO HAPA CHINI - ZOTE ZINASOMA FIREBASE DIRECT
function loadVideos(){
fetch(DB_URL+"/settings/videos.json").then(r=>r.json()).then(d=>{
let html="";if(d){Object.keys(d).forEach(k=>{html+=`<h4>${d[k].title}</h4><iframe class="help-video" height="200" src="${d[k].link}" frameborder="0" allowfullscreen></iframe>`})}
helpVideos.innerHTML=html;
})}

function loadUpdates(){
fetch(DB_URL+"/settings/updates.json").then(r=>r.json()).then(d=>{
let html="";if(d){Object.keys(d).reverse().forEach(k=>{html+=`<div class="update-box"><h4>${d[k].title}</h4><div>${d[k].text}</div></div>`})}
updatesList.innerHTML=html;
})}

function saveVideo(){
let k=videoEditKey.value;let v={title:videoTitle.value,link:videoLink.value};
let url=k?`${DB_URL}/settings/videos/${k}.json`:`${DB_URL}/settings/videos.json`;
fetch(url,{method:k?"PUT":"POST",body:JSON.stringify(v)}).then(()=>{
showToast(k?"Imehaririwa":"Imeongezwa");
videoTitle.value="";videoLink.value="";videoEditKey.value="";
addVideoBtn.innerText="ONGEZA VIDEO";
loadAdminVideos();loadVideos();
})}

function editVideo(k,t,l){videoEditKey.value=k;videoTitle.value=t;videoLink.value=l;addVideoBtn.innerText="SASISHA VIDEO"}
function deleteVideo(k){if(confirm("Futa?")){fetch(`${DB_URL}/settings/videos/${k}.json`,{method:"DELETE"}).then(()=>{showToast("Imefutwa");loadAdminVideos();loadVideos()})}}

function loadAdminVideos(){
fetch(DB_URL+"/settings/videos.json").then(r=>r.json()).then(d=>{
let html="";if(d){Object.keys(d).forEach(k=>{html+=`<div class="admin-product-item"><span>${d[k].title}</span><div><button class="btn-edit" onclick="editVideo('${k}','${d[k].title}','${d[k].link}')">HARIRI</button><button class="btn-delete" onclick="deleteVideo('${k}')">FUTA</button></div></div>`})}
adminVideoList.innerHTML=html;
})}

function saveUpdate(){
let k=updateEditKey.value;let u={title:updateTitle.value,text:updateText.value};
let url=k?`${DB_URL}/settings/updates/${k}.json`:`${DB_URL}/settings/updates.json`;
fetch(url,{method:k?"PUT":"POST",body:JSON.stringify(u)}).then(()=>{
showToast(k?"Imehaririwa":"Imetumwa");
updateTitle.value="";updateText.value="";updateEditKey.value="";
addUpdateBtn.innerText="POST TAARIFA";
loadAdminUpdates();loadUpdates();
})}

function editUpdate(k,t,x){updateEditKey.value=k;updateTitle.value=t;updateText.value=decodeURIComponent(x);addUpdateBtn.innerText="SASISHA TAARIFA"}
function deleteUpdate(k){if(confirm("Futa?")){fetch(`${DB_URL}/settings/updates/${k}.json`,{method:"DELETE"}).then(()=>{showToast("Imefutwa");loadAdminUpdates();loadUpdates()})}}

function loadAdminUpdates(){
fetch(DB_URL+"/settings/updates.json").then(r=>r.json()).then(d=>{
let html="";if(d){Object.keys(d).reverse().forEach(k=>{html+=`<div class="admin-product-item"><span>${d[k].title}</span><div><button class="btn-edit" onclick="editUpdate('${k}','${d[k].title}','${encodeURIComponent(d[k].text)}')">HARIRI</button><button class="btn-delete" onclick="deleteUpdate('${k}')">FUTA</button></div></div>`})}
adminUpdateList.innerHTML=html;
})}
</script>
</body>
</html>
